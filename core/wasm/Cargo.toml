[package]
name = "openpixel-wasm"
description = "OpenPixel's engine for JavaScript: the wasm-bindgen face of openpixel-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openpixel-core = { path = "../engine" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Must be exactly the version of the wasm-bindgen command that generates the JavaScript.
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
