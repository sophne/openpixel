[package]
name = "openpixel-core"
description = "OpenPixel's engine: the document, every tool, rendering and file formats."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
base64 = "0.23"
flate2 = "1"
png = "0.18"
gif = "0.14"
# sin and cos for the renderer: the same results on every platform and under WebAssembly.
libm = "0.2"

# The update feed over HTTPS. Not under WebAssembly: there the host fetches it (HostIo::http_get).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
