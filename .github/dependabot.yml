version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, skip-changelog]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    labels: [dependencies, website]
    # Minor and patch updates arrive together in one pull request. Major versions come one by one, so a breaking
    # change can't hold back the rest.
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The site runs on Node 22 (web/Dockerfile, web-ci); its types move with it, not ahead of it.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # eslint-config-next and typescript-eslint don't support ESLint 10 or TypeScript 6+ yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  # The desktop app: Electron, React, Vite and the test tools.
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      desktop:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The app and its CI run on Node 22 (Electron's own Node is close to it); its types move with it.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  # The Rust core. The wasm-bindgen crate and the wasm-bindgen command CI installs must be the same version
  # (desktop/scripts/build-core.mjs, .github/workflows/ci.yml): update them together, by hand.
  - package-ecosystem: cargo
    directory: /core
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      core:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: wasm-bindgen
