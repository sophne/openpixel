name: Bug report
description: Something in OpenPixel doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: OpenPixel version
      description: "About OpenPixel: in the OpenPixel menu on macOS, in the Help menu on Windows and Linux"
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations: { required: true }
  - type: input
    id: os-version
    attributes:
      label: Its version, and how you installed OpenPixel
      description: For example "macOS 15.3, Apple silicon", "Windows 11", "Ubuntu 24.04, AppImage" or "Debian 12, .deb"
  - type: input
    id: agent
    attributes:
      label: Agent, if one was involved
      description: For example Claude Code 2.1 or Cursor 1.4
  - type: markdown
    attributes:
      value: "Found a security problem? Please don't open an issue: follow SECURITY.md instead."
