# Checks every pull request. Each job runs only when its part of the repository changed; a skipped job counts as
# passed, so the required checks (app-ci, web-ci) never block a pull request that doesn't touch them.
#   app-ci   the app (required): the Rust core and the desktop app, on Linux, with the UI test.
#   web-ci   the website (required).
#   app on macOS / Windows   the same app on the other two systems, and an unsigned package of it. Not required:
#            it tells you early that something broke there, but a pull request can merge without it.
# See docs/desktop-architecture.md for what the parts are.
# Nothing runs on pushes to main: main only changes through pull requests that already passed here, Coolify builds
# the website on its own, and the release workflow builds and checks the app again before it ships anything.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then  # started by hand: check everything
            for part in app web; do echo "$part=true" >> "$GITHUB_OUTPUT"; done; exit 0
          fi
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          printf '%s\n' "$files"
          touches() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          # The app is the core and the desktop app. The core's golden tests also read the artwork and the pictures
          # exported from it, which live with the website (web/artwork, web/public).
          echo "app=$(touches '^(core/|desktop/|web/artwork/|web/public/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "web=$(touches '^(web/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  # If working out the changes fails, the jobs below run rather than silently skipping.

  # The app, on Linux: the core (build without warnings, self-test, golden files, the MCP program, one scripted
  # session run natively and through the WebAssembly build with every answer and file compared), then the desktop
  # app (types, the app logic's checks, the bundle, the shell, the UI test, the browser preview, known
  # vulnerabilities).
  app:
    name: app-ci
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: WebAssembly tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: "Core: build without warnings"
        working-directory: core
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release
      - name: "Core: tests (self-test, golden files, MCP, native against WebAssembly)"
        working-directory: core
        run: cargo test --release
      - name: "Core: self-test of the MCP program"
        working-directory: core
        run: cargo run --release --bin openpixel -- --selftest

      - name: "Desktop: packages"
        working-directory: desktop
        run: npm ci --no-fund
      - name: "Desktop: the core as WebAssembly, and the MCP program"
        working-directory: desktop
        run: npm run build:core && npm run build:mcp
      - name: "Desktop: types"
        working-directory: desktop
        run: npm run typecheck
      - name: "Desktop: app logic (tabs, autosave, library, agents, Agent Chat)"
        working-directory: desktop
        run: npm test
      - name: "Desktop: build"
        working-directory: desktop
        run: npm run build
      - name: Display and video tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb ffmpeg
      - name: Video recorder for the tests
        working-directory: desktop
        run: npx playwright install ffmpeg
      - name: "Desktop: shell (window, menus, messages, shortcuts shown against shortcuts bound, screenshots)"
        working-directory: desktop
        run: npm run test:shell
      # The page clicks through itself in the real app, on the real core. A run with failures is repeated once and
      # only what fails both times counts (tests/run-ui-test.mjs).
      - name: "Desktop: UI test"
        working-directory: desktop
        run: npm run test:ui -- --no-video --no-build
      # The same test with the page shown as on a Mac (its tab bar layout and ⌘ wording), since the macOS job below
      # is not required.
      - name: "Desktop: UI test, the page shown as on macOS"
        working-directory: desktop
        run: npm run test:ui -- --platform darwin --no-video --no-build
      - name: "Desktop: the same core package in a plain browser"
        working-directory: desktop
        run: npx playwright install chromium && npm run test:web
      - name: "Desktop: known vulnerabilities in dependencies"
        working-directory: desktop
        run: npm audit --audit-level=high

  web:
    name: web-ci
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=high

  # The app on the other two systems it ships for. Not a required check.
  platforms:
    name: app on ${{ matrix.name }} (not required)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macOS, arch: arm64 }
          - { os: windows-latest, name: Windows, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Golden files are compared as they are in the repository: no line-ending conversion on Windows.
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: WebAssembly tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: "Core: build without warnings"
        working-directory: core
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release
      - name: "Core: tests (self-test, golden files, MCP, native against WebAssembly)"
        working-directory: core
        run: cargo test --release
      - name: "Core: self-test of the MCP program"
        working-directory: core
        run: cargo run --release --bin openpixel -- --selftest

      - name: "Desktop: packages"
        working-directory: desktop
        run: npm ci --no-fund
      - name: "Desktop: the core as WebAssembly, and the MCP program"
        working-directory: desktop
        run: npm run build:core && npm run build:mcp
      - name: "Desktop: types"
        working-directory: desktop
        run: npm run typecheck
      - name: "Desktop: app logic (tabs, autosave, library, agents, Agent Chat)"
        working-directory: desktop
        run: npm test
      - name: "Desktop: build"
        working-directory: desktop
        run: npm run build
      - name: Video recorder for the tests
        working-directory: desktop
        run: npx playwright install ffmpeg
      - name: "Desktop: shell (window, menus, messages, shortcuts shown against shortcuts bound, screenshots)"
        working-directory: desktop
        run: npm run test:shell
      # The UI test was written and tuned on Linux with software rendering and has not yet proved itself on this
      # system's own window, fonts and graphics card. Until it has, its result is shown but does not fail the job.
      - name: "Desktop: UI test (shown only: does not fail the job yet)"
        working-directory: desktop
        continue-on-error: true
        run: npm run test:ui -- --no-video --no-build
      # Packaging breaks in its own ways (files missing from the package, the MCP program not staged): assemble the
      # unsigned app for this machine's processor, as the release does before it signs and wraps it.
      - name: "Desktop: package the unsigned app"
        working-directory: desktop
        run: npx electron-builder --dir --${{ matrix.arch }}
