# Static security analysis of the JavaScript/TypeScript (the desktop app's shell, logic and page, and the website)
# and of the Rust core.
# JavaScript/TypeScript (about a minute, nothing to build) also checks pull requests that change it; changes that
# are only pictures, media, data or art sources (no code for CodeQL to read) don't start it. Rust runs
# weekly and on demand (Actions → codeql → Run workflow): CodeQL reads Rust sources without building them
# (build-mode none), but resolves the workspace's dependencies first, which takes a few minutes.
name: codeql
on:
  pull_request:
    paths:
      - "web/**"
      - "desktop/**"
      - ".github/workflows/codeql.yml"
      - "!**/*.png"
      - "!**/*.gif"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.webp"
      - "!**/*.ico"
      - "!**/*.icns"
      - "!**/*.svg"
      - "!**/*.mp4"
      - "!**/*.webm"
      - "!**/*.zip"
      - "!**/*.vox"
      - "!**/*.obj"
      - "!**/*.openpixel"
      - "!**/*.woff2"
      - "!**/*.txt"
      - "!**/*.md"
      - "!web/public/**/*.json"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    name: codeql (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # CodeQL reads its own workflow run to report status
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript

  rust:
    name: codeql (rust)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:rust
